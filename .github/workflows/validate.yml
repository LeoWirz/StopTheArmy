name: validate
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Edit only the sources; this job keeps every generated file in sync.
  # On push it runs scripts/sync.py and commits the result back to the branch.
  # (Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.)
  # On pull requests it only checks, since it can't push to the PR branch.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sync-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated files (pull requests)
        if: github.event_name == 'pull_request'
        run: python scripts/sync.py --check
      - name: Regenerate and commit (pushes)
        if: github.event_name == 'push'
        run: |
          python scripts/sync.py
          git add -A
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate harness files" -m "Automated by .github/workflows/validate.yml running scripts/sync.py."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  test:
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        # windows-latest has Git Bash, Windows PowerShell 5.1 and PowerShell 7;
        # ubuntu-latest has dash as /bin/sh, plus pwsh; macOS has bash 3.2 as /bin/sh.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/sync.py # test exactly what the sync job committed
      - run: python scripts/test_hooks.py
      - name: link-skills.ps1 (run twice; the real skills must survive)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\link-skills.ps1 "$env:RUNNER_TEMP\lt"
          .\scripts\link-skills.ps1 "$env:RUNNER_TEMP\lt"
          $first = Get-ChildItem -Directory skills | Select-Object -First 1
          if (-not (Test-Path "$env:RUNNER_TEMP\lt\$($first.Name)\SKILL.md")) { throw 'link missing' }
          if (-not (Test-Path "skills\$($first.Name)\SKILL.md")) { throw 'real skills were deleted' }
